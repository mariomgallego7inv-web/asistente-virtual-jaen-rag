<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jaén AI – Iniciando...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .logo-icon {
      width: 72px; height: 72px;
      background: #1d4ed8;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 26px; font-weight: 600;
      color: #f1f5f9; letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px; color: #94a3b8;
      margin-bottom: 48px;
    }

    .bar-wrap {
      width: 320px; height: 6px;
      background: #1e293b;
      border-radius: 99px; overflow: hidden;
      margin-bottom: 16px;
    }

    .bar-fill {
      height: 100%; border-radius: 99px;
      background: #3b82f6;
      width: 0%;
      transition: width 0.5s ease;
    }

    .status {
      font-size: 13px; color: #64748b;
      min-height: 20px; text-align: center;
    }

    .dot { animation: blink 1.2s infinite; display: inline-block; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40%            { opacity: 1;   }
    }

    .success-msg {
      font-size: 14px; color: #4ade80;
      margin-top: 20px; display: none;
    }
  </style>
</head>
<body>

  <div style="text-align:center;">
    <div class="logo-icon">🏛️</div>
    <h1>Jaén AI</h1>
    <p class="subtitle">Comparador Administrativo</p>

    <div class="bar-wrap">
      <div class="bar-fill" id="bar"></div>
    </div>

    <p class="status" id="status">
      Iniciando el servidor
      <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </p>

    <p class="success-msg" id="success">✓ Listo. Cargando la aplicación...</p>
  </div>

<script>
  const bar       = document.getElementById('bar');
  const statusEl  = document.getElementById('status');
  const successEl = document.getElementById('success');

  const phases = [
    { pct: 15, msg: 'Iniciando el servidor' },
    { pct: 35, msg: 'Cargando motor de búsqueda vectorial' },
    { pct: 55, msg: 'Preparando modelos de IA' },
    { pct: 75, msg: 'Configurando la interfaz' },
    { pct: 90, msg: 'Casi listo' },
  ];

  let phaseIdx = 0;
  function nextPhase() {
    if (phaseIdx < phases.length) {
      const p = phases[phaseIdx++];
      bar.style.width = p.pct + '%';
      statusEl.innerHTML = p.msg +
        ' <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';
    }
  }

  nextPhase();
  const phaseTimer = setInterval(nextPhase, 4000);

  // Usar XMLHttpRequest en lugar de fetch (funciona desde file://)
  function checkReady() {
    const xhr = new XMLHttpRequest();
    xhr.timeout = 1500;

    xhr.onload = function() {
      if (xhr.status === 200) {
        clearInterval(phaseTimer);
        clearInterval(pollTimer);
        bar.style.width = '100%';
        statusEl.style.display = 'none';
        successEl.style.display = 'block';
        setTimeout(() => { window.location.href = 'http://127.0.0.1:8000/'; }, 800);
      }
    };

    xhr.onerror   = function() { /* servidor aún no listo */ };
    xhr.ontimeout = function() { /* timeout, reintentamos */ };

    xhr.open('GET', 'http://127.0.0.1:8000/api/health', true);
    xhr.send();
  }

  // Esperar 5s antes del primer intento (dar tiempo al servidor)
  setTimeout(() => {
    checkReady();
    pollTimer = setInterval(checkReady, 2000);
  }, 5000);

  var pollTimer;
</script>  
</body>
</html>
